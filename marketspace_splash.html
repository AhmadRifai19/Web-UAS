<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketSpace - Splash Screen</title>
    <style>
        /* Modern CSS Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Georgia', serif; /* Serif font similar to the image */
            background-color: #e6e6e6; /* Light gray background matching the image */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .logo-wrapper {
            margin-bottom: 2rem;
            /* Container for the logo image */
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Add a subtle drop shadow to make the logo pop if it's transparent */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: translateY(-5px);
        }

        .logo-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        /* Loading animation dots */
        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 2rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #65b511; /* Green from the logo */
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .logo-wrapper {
                width: 200px;
                height: 200px;
            }
            .brand-name {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <!-- Logo Image: Replace 'marketspace_logo.png' with the actual path to your logo file -->
        <div class="logo-wrapper">
            <img src="marketspace_logo.png" alt="MarketSpace Logo" class="logo-image" id="logoImg" onerror="this.onerror=null; this.style.display='none'; document.getElementById('logoPlaceholder').style.display='flex';">
            <!-- Fallback placeholder if image is not found -->
            <div id="logoPlaceholder" style="display: none; width: 100%; height: 100%; background: linear-gradient(135deg, #65b511, #1a8b1a); border-radius: 20%; color: white; font-family: sans-serif; font-size: 5rem; font-weight: bold; align-items: center; justify-content: center; position: relative; overflow: hidden;">
                M
                <div style="position: absolute; bottom: 10%; right: 10%; width: 30px; height: 30px; background: #8a2be2; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px;">
                    <div style="background: white;"></div><div style="background: white;"></div>
                    <div style="background: white;"></div><div style="background: white;"></div>
                </div>
            </div>
        </div>
        
        <h1 class="brand-name">MarketSpace</h1>

        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Optional: Redirect to main app after a few seconds
        /*
        setTimeout(() => {
            window.location.href = 'home.html'; // Change to your main page
        }, 3000);
        */
    </script>
</body>
</html>
